name: suitecrm

services:
  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: suitecrm_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:80"
    environment:
      # NOTE: the SUITECRM_INSTALL_* variables below are only used once, the first
      # time the container starts against an empty app_data volume, and only if
      # SUITECRM_SILENT_INSTALL=true. See README > Silent Install.
      SUITECRM_INSTALL_DB_HOST: db
      SUITECRM_INSTALL_DB_NAME: suitecrm
      SUITECRM_INSTALL_DB_USER: suitecrm
      SUITECRM_INSTALL_DB_PASSWORD: suitecrm_password
      # Set to "true" (e.g. `SUITECRM_SILENT_INSTALL=true docker compose up`) to skip
      # the web installer and provision SuiteCRM automatically using the settings
      # above (see README > Silent Install).
      SUITECRM_SILENT_INSTALL: "${SUITECRM_SILENT_INSTALL:-false}"
      SUITECRM_INSTALL_SITE_URL: http://localhost:8080
      SUITECRM_INSTALL_ADMIN_PASSWORD: admin
      SUITECRM_INSTALL_DEMO_DATA: "no"
      # Locale / currency / date-time (see README > Silent Install)
      SUITECRM_INSTALL_DEFAULT_LANGUAGE: "${SUITECRM_INSTALL_DEFAULT_LANGUAGE:-en_us}"
      SUITECRM_INSTALL_DEFAULT_CHARSET: "${SUITECRM_INSTALL_DEFAULT_CHARSET:-UTF-8}"
      SUITECRM_INSTALL_DEFAULT_DATE_FORMAT: "${SUITECRM_INSTALL_DEFAULT_DATE_FORMAT:-m/d/Y}"
      SUITECRM_INSTALL_DEFAULT_TIME_FORMAT: "${SUITECRM_INSTALL_DEFAULT_TIME_FORMAT:-h:ia}"
      SUITECRM_INSTALL_CURRENCY_NAME: "${SUITECRM_INSTALL_CURRENCY_NAME:-US Dollar}"
      SUITECRM_INSTALL_CURRENCY_SYMBOL: "${SUITECRM_INSTALL_CURRENCY_SYMBOL:-$$}"
      SUITECRM_INSTALL_CURRENCY_ISO4217: "${SUITECRM_INSTALL_CURRENCY_ISO4217:-USD}"
      SUITECRM_INSTALL_CURRENCY_SIGNIFICANT_DIGITS: "${SUITECRM_INSTALL_CURRENCY_SIGNIFICANT_DIGITS:-2}"
      SUITECRM_INSTALL_NUMBER_GROUPING_SEPARATOR: "${SUITECRM_INSTALL_NUMBER_GROUPING_SEPARATOR:-,}"
      SUITECRM_INSTALL_DECIMAL_SEPARATOR: "${SUITECRM_INSTALL_DECIMAL_SEPARATOR:-.}"
      SUITECRM_INSTALL_DISABLE_PERSISTENT_CONNECTIONS: "${SUITECRM_INSTALL_DISABLE_PERSISTENT_CONNECTIONS:-false}"
    volumes:
      - app_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  cron:
    build: .
    # Sidecar per Schedulers SuiteCRM - replica la riga richiesta dalla doc:
    # * * * * * cd /var/www/html; php -f cron.php > /dev/null 2>&1
    # Usa la stessa immagine/volume dell'app, esegue cron.php ogni 60s come www-data.
    # Stessa logica di k8s/cronjob.yaml, ma come loop (senza crond) per non richiedere
    # pacchetti extra nell'immagine.
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "SuiteCRM cron sidecar started (schedule: * * * * * -> cron.php)"
        while true; do
          if [ -f /var/www/html/config.php ]; then
            su www-data -s /bin/sh -c "cd /var/www/html && php -f cron.php" || echo "cron.php failed at $$(date)" >&2
          else
            echo "$$(date): config.php not found, skipping cron run"
          fi
          sleep 60
        done
    volumes:
      - app_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
  app_data: