# CronJob for the SuiteCRM Scheduler: cron.php must run every minute as
# www-data from the docroot. Mounts the same RWO PVC as the Deployment;
# with concurrencyPolicy: Forbid it never overlaps the app pod on the volume.
# Image pull policy matches the Deployment (Always, floating 7.15.2 tag).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: suitecrm-cron
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: cron
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 82
            runAsGroup: 82
            fsGroup: 82
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cron
              image: ghcr.io/modalsource/suitecrm-container:7.15.2
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # The container already runs as www-data (UID 82): no su needed.
              command:
                - sh
                - -c
                - |
                  if [ ! -f /var/www/html/config.php ]; then
                    echo "config.php not found, skipping cron run"
                    exit 0
                  fi
                  cd /var/www/html && php -f cron.php
              volumeMounts:
                - name: app-data
                  mountPath: /var/www/html
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
          volumes:
            - name: app-data
              persistentVolumeClaim:
                claimName: suitecrm-data
