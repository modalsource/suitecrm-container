# CronJob for SuiteCRM Schedulers.
# SuiteCRM requires cron.php to be run every minute as the www-data user.
# This job uses the same image as the app and mounts the same PVC (RWO):
# with concurrencyPolicy: Forbid it never overlaps. Image pull policy must stay
# consistent with the Deployment (IfNotPresent / Always).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: suitecrm-cron
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: cron
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron
              image: suitecrm:7.15.2-r0 # <-- same image as the Deployment (Bitnami-style rN)
              imagePullPolicy: IfNotPresent
              # SuiteCRM cron.php must be run as www-data in the docroot
              command:
                - sh
                - -c
                - |
                  # Wait until config.php exists (installation completed)
                  if [ ! -f /var/www/html/config.php ]; then
                    echo "config.php not found, skipping cron run"
                    exit 0
                  fi
                  # Run scheduler as www-data if available, otherwise as current user
                  if id www-data >/dev/null 2>&1; then
                    su www-data -s /bin/sh -c "cd /var/www/html && php -f cron.php"
                  else
                    cd /var/www/html && php -f cron.php
                  fi
              volumeMounts:
                - name: app-data
                  mountPath: /var/www/html
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
          volumes:
            - name: app-data
              persistentVolumeClaim:
                claimName: suitecrm-app-data
