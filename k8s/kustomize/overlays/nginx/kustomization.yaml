# NGINX full-stack overlay: app + NGINX Ingress + in-cluster MariaDB.
# Usage:
#   kubectl apply -k k8s/overlays/nginx
# Requires ingress-nginx installed on OVH MKS (see k8s/app/ingress-nginx.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: suitecrm

resources:
  - ../../namespace.yaml
  - ../../app
  - ../../app/ingress-nginx.yaml
  - ../../database/mariadb

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: suitecrm-stack-nginx
