# Secret for MariaDB (database).
# Used ONLY if you deploy the DB in-cluster via k8s/database/mariadb.
# If you use Percona / external DB / OVH Cloud DB, DO NOT apply this secret:
# k8s/app/secret.yaml with the DB user password is enough.
#
# WARNING: change values before applying!
# If you deploy both app and mariadb, `mysql-password` MUST match
# `db-password` in k8s/app/secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: suitecrm-mariadb-secrets
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: db
type: Opaque
stringData:
  mysql-root-password: "CHANGE_ME_root_password"
  mysql-password: "CHANGE_ME_suitecrm_password"
