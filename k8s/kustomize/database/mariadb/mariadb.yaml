apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitecrm-mariadb
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: db
spec:
  replicas: 1
  strategy:
    type: Recreate # required with RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suitecrm-mariadb-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: suitecrm
            - name: MYSQL_USER
              value: suitecrm
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suitecrm-mariadb-secrets
                  key: mysql-password
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: suitecrm-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: suitecrm-mariadb
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: db
spec:
  selector:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: db
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
  type: ClusterIP
