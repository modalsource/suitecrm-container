# PVC for MariaDB on OVH Managed Kubernetes.
# OVH CSI Cinder StorageClasses:
#   - csi-cinder-high-speed       -> SSD (recommended)
#   - csi-cinder-classic          -> HDD
#   - csi-cinder-high-speed-gen2  -> only in some regions
# Check: kubectl get storageclasses
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: suitecrm-db-data
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-cinder-high-speed
  resources:
    requests:
      storage: 10Gi
