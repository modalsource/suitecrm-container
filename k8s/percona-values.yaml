# Generic Percona MySQL values for SuiteCRM (percona/ps-db Helm chart, 1.1.0).
# Single-node, single-router layout: good for dev and small deployments.
# Replace <storage-class> and adjust sizing as needed.
#
# Usage:
#   helm upgrade --install <release> percona/ps-db \
#     --version 1.1.0 -f percona-values.yaml -n <namespace>
#
# The SuiteCRM schema and user are created by db-init-job.yaml; the root
# password is auto-generated by the operator in <release>-ps-db-secrets.

crVersion: 1.1.0
enableVolumeExpansion: true
updateStrategy: SmartUpdate
upgradeOptions:
  apply: never
  versionServiceEndpoint: "https://check.percona.com"

# Required for size: 1 clusters; remove if raising size
unsafeFlags:
  mysqlSize: true
  proxySize: true

mysql:
  clusterType: group-replication
  autoRecovery: true
  size: 1
  exposePrimary:
    enabled: false
  gracePeriod: 600
  livenessProbe:
    failureThreshold: 30
    timeoutSeconds: 60
  configuration: |
    [mysqld]
    mysql_native_password=ON
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    binlog_expire_logs_seconds=604800
  resources:
    requests:
      memory: 1Gi
      cpu: 300m
    limits:
      memory: 1Gi  # must equal requests.memory
      cpu: "1"
  volumeSpec:
    pvc:
      storageClassName: <storage-class>
      resources:
        requests:
          storage: 10Gi
  # Optional: node affinity for this cluster's pods, e.g. a cheap nodepool:
  #   affinity:
  #     antiAffinityTopologyKey: kubernetes.io/hostname
  #     advanced:
  #       nodeAffinity:
  #         preferredDuringSchedulingIgnoredDuringExecution:
  #           - weight: 100
  #             preference:
  #               matchExpressions:
  #                 - key: nodepool
  #                   operator: In
  #                   values: ["<nodepool>"]

proxy:
  haproxy:
    enabled: false
  router:
    enabled: true
    size: 1
    resources:
      requests:
        memory: 256M
      limits:
        memory: 512M
    podDisruptionBudget:
      maxUnavailable: 1
    gracePeriod: 30
    # Router supports nodeSelector only (no advanced affinity in the chart):
    #   nodeSelector:
    #     nodepool: <nodepool>

orchestrator:
  enabled: false

pmm:
  enabled: false

# Disabled by default. When needed, point to your S3-compatible storage:
#   backup:
#     enabled: true
#     schedule:
#       - name: daily
#         schedule: "0 3 * * *"
#         keep: 7
#         type: full
#         storageName: s3
#     storages:
#       s3:
#         type: s3
#         s3:
#           endpointUrl: https://s3.example.com/
#           bucket: <bucket>
#           credentialsSecret: <backup-secret>
backup:
  enabled: false
