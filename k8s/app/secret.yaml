# Secret for SuiteCRM (app).
# Contains credentials to connect to the DB + SuiteCRM admin password.
# This is the ONLY secret required when using an external DB (Percona, OVH Cloud DB, etc.).
# If you also deploy k8s/database/mariadb, make sure `db-password` matches
# `mysql-password` in k8s/database/mariadb/secret.yaml.
#
# WARNING: change values before applying!
# Generate with:
#   kubectl create secret generic suitecrm-secrets -n suitecrm \
#     --from-literal=db-password='...' \
#     --from-literal=suitecrm-admin-password='...' \
#     --dry-run=client -o yaml > k8s/app/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: suitecrm-secrets
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
type: Opaque
stringData:
  # Password for DB user `suitecrm` (used as SUITECRM_INSTALL_DB_PASSWORD)
  # Must match the user password in the external DB / MariaDB.
  db-password: "CHANGE_ME_suitecrm_password"
  # SuiteCRM admin password (only on first boot with SUITECRM_SILENT_INSTALL=true)
  suitecrm-admin-password: "CHANGE_ME_admin_password"
