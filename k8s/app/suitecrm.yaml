apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
spec:
  replicas: 1 # Do NOT scale >1 with RWO PVC. For HA you need RWX storage (see README)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm
        app.kubernetes.io/component: app
    spec:
      initContainers:
        # Wait until the DB is reachable before starting SuiteCRM.
        # Uses the same env as the main container, so it works with both
        # in-cluster MariaDB (suitecrm-mariadb:3306) and Percona/external.
        - name: wait-for-db
          image: busybox:1.36
          env:
            - name: SUITECRM_INSTALL_DB_HOST
              value: "suitecrm-mariadb"
            - name: SUITECRM_INSTALL_DB_PORT
              value: "3306"
          command:
            - sh
            - -c
            - |
              echo "Waiting for DB ${SUITECRM_INSTALL_DB_HOST}:${SUITECRM_INSTALL_DB_PORT}..."
              until nc -z "${SUITECRM_INSTALL_DB_HOST}" "${SUITECRM_INSTALL_DB_PORT}"; do
                echo "DB not ready, retrying in 2s..."
                sleep 2
              done
              echo "DB is reachable"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: suitecrm
          # REPLACE with the image pushed to OVH registry / Docker Hub / GHCR.
          # Example (Bitnami-style vX.Y.Z-rN -> 7.15.2-r0, 7.15.2, 7.15, 7 senza latest):
          #   docker build --build-arg SUITECRM_VERSION=7.15.2 -t harbor.gra7.container-registry.ovh.net/<project>/suitecrm:7.15.2-r0 .
          #   docker push harbor.gra7.container-registry.ovh.net/<project>/suitecrm:7.15.2-r0
          image: suitecrm:7.15.2-r0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            # --- DB connection (edit for external DB / Percona) ---
            # If you use Percona or OVH Cloud DB, change these values via kustomize patch
            # or direct edit. Example Percona: host `percona` or `percona.suitecrm.svc.cluster.local`
            - name: SUITECRM_INSTALL_DB_HOST
              value: "suitecrm-mariadb"
            - name: SUITECRM_INSTALL_DB_PORT
              value: "3306"
            - name: SUITECRM_INSTALL_DB_NAME
              value: "suitecrm"
            - name: SUITECRM_INSTALL_DB_USER
              value: "suitecrm"
            - name: SUITECRM_INSTALL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suitecrm-secrets
                  key: db-password
            - name: SUITECRM_SILENT_INSTALL
              value: "true"
            # IMPORTANT: public URL of the Ingress (see ingress-nginx.yaml / ingress-traefik.yaml)
            - name: SUITECRM_INSTALL_SITE_URL
              value: "https://suitecrm.example.com"
            - name: SUITECRM_INSTALL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suitecrm-secrets
                  key: suitecrm-admin-password
            - name: SUITECRM_INSTALL_DEMO_DATA
              value: "no"
            # Locale — override if you need it_it
            - name: SUITECRM_INSTALL_DEFAULT_LANGUAGE
              value: "en_us"
            - name: SUITECRM_INSTALL_DEFAULT_CHARSET
              value: "UTF-8"
            - name: SUITECRM_INSTALL_CURRENCY_NAME
              value: "US Dollar"
            - name: SUITECRM_INSTALL_CURRENCY_SYMBOL
              value: "$"
            - name: SUITECRM_INSTALL_CURRENCY_ISO4217
              value: "USD"
            - name: SUITECRM_INSTALL_CURRENCY_SIGNIFICANT_DIGITS
              value: "2"
            - name: SUITECRM_INSTALL_NUMBER_GROUPING_SEPARATOR
              value: ","
            - name: SUITECRM_INSTALL_DECIMAL_SEPARATOR
              value: "."
            - name: SUITECRM_INSTALL_DISABLE_PERSISTENT_CONNECTIONS
              value: "false"
          volumeMounts:
            - name: app-data
              mountPath: /var/www/html
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18 # 3 minutes max for extraction + silent install
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: suitecrm-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: suitecrm
  namespace: suitecrm
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  type: ClusterIP
