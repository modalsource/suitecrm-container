# SuiteCRM - Deployment + Service + PVC (plain YAML, no Kustomize).
# Replace every <...> placeholder before applying.
#
# The image is public on GHCR: no imagePullSecrets needed.
# Silent install: on first start (no config.php), the entrypoint installs
# SuiteCRM using the SUITECRM_INSTALL_* variables below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: suitecrm-data
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: <storage-class>
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitecrm
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
spec:
  # RWO volume: keep 1 replica. Recreate avoids deadlocks on redeploys.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: suitecrm
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suitecrm
        app.kubernetes.io/component: app
    spec:
      # Optional: pin pods to a nodepool via soft affinity, e.g.
      #   affinity:
      #     nodeAffinity:
      #       preferredDuringSchedulingIgnoredDuringExecution:
      #         - weight: 100
      #           preference:
      #             matchExpressions:
      #               - key: nodepool
      #                 operator: In
      #                 values: ["<nodepool>"]
      initContainers:
        # Wait until the database is reachable before starting SuiteCRM.
        - name: wait-for-db
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: <db-host>
            - name: DB_PORT
              value: "<db-port>"
          command:
            - sh
            - -c
            - |
              echo "Waiting for DB ${DB_HOST}:${DB_PORT}..."
              until nc -z "${DB_HOST}" "${DB_PORT}"; do
                echo "DB not ready, retrying in 2s..."
                sleep 2
              done
              echo "DB is reachable"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: suitecrm
          # Floating on the SuiteCRM minor: pulls the newest revision (rN) of 7.15.x.
          # Pin to a revision (e.g. 7.15.2-r0) for absolute stability.
          image: ghcr.io/modalsource/suitecrm-container:7.15.2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SUITECRM_INSTALL_DB_HOST
              value: <db-host>
            - name: SUITECRM_INSTALL_DB_PORT
              value: "<db-port>"
            - name: SUITECRM_INSTALL_DB_NAME
              value: <db-name>
            - name: SUITECRM_INSTALL_DB_USER
              value: <db-user>
            - name: SUITECRM_INSTALL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suitecrm-secrets
                  key: db-password
            - name: SUITECRM_SILENT_INSTALL
              value: "true"
            - name: SUITECRM_INSTALL_SITE_URL
              value: https://<hostname>
            - name: SUITECRM_INSTALL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suitecrm-secrets
                  key: suitecrm-admin-password
            - name: SUITECRM_INSTALL_DEMO_DATA
              value: "no"
            # Locale - for Italian see compose.it.yml reference values
            - name: SUITECRM_INSTALL_DEFAULT_LANGUAGE
              value: en_us
            - name: SUITECRM_INSTALL_DEFAULT_CHARSET
              value: UTF-8
            - name: SUITECRM_INSTALL_CURRENCY_NAME
              value: US Dollar
            - name: SUITECRM_INSTALL_CURRENCY_SYMBOL
              value: "$"
            - name: SUITECRM_INSTALL_CURRENCY_ISO4217
              value: USD
            - name: SUITECRM_INSTALL_CURRENCY_SIGNIFICANT_DIGITS
              value: "2"
            - name: SUITECRM_INSTALL_NUMBER_GROUPING_SEPARATOR
              value: ","
            - name: SUITECRM_INSTALL_DECIMAL_SEPARATOR
              value: "."
            - name: SUITECRM_INSTALL_DISABLE_PERSISTENT_CONNECTIONS
              value: "false"
          volumeMounts:
            - name: app-data
              mountPath: /var/www/html
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18 # 3 minutes max for extraction + silent install
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: suitecrm-data
---
apiVersion: v1
kind: Service
metadata:
  name: suitecrm
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: suitecrm
    app.kubernetes.io/component: app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  type: ClusterIP
