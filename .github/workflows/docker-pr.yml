name: PR - Build and scan

on:
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ github.repository }}:pr-${{ github.event.number }}

      - name: Install docker-squash and squash layers
        run: |
          pip install --break-system-packages docker-squash 2>/dev/null || pip install docker-squash
          docker-squash ${{ github.repository }}:pr-${{ github.event.number }} \
            -t ${{ github.repository }}:pr-${{ github.event.number }}-squashed

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ github.repository }}:pr-${{ github.event.number }}-squashed
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Generate vulnerability summary
        if: always()
        shell: bash
        run: |
          REPORT=${{ github.workspace }}/trivy-report.json
          trivy image --format json \
            --cache-dir ${{ github.workspace }}/.cache/trivy \
            --skip-db-update \
            --skip-java-db-update \
            -o "$REPORT" \
            ${{ github.repository }}:pr-${{ github.event.number }}
          echo ""
          echo "======= Trivy Vulnerability Summary ======="
          echo ""
          jq -r '
            .Results[]? | select(.Vulnerabilities != null) |
            "\(.Target) | \(.Type) | \([.Vulnerabilities[] | select(.Severity == "CRITICAL")] | length) | \([.Vulnerabilities[] | select(.Severity == "HIGH")] | length) | \([.Vulnerabilities[] | select(.Severity == "MEDIUM")] | length) | \([.Vulnerabilities[] | select(.Severity == "LOW")] | length) | \([.Vulnerabilities[] | select(.Severity == "UNKNOWN")] | length)"' "$REPORT" | \
          {
            echo "Target | Type | CRITICAL | HIGH | MEDIUM | LOW | UNKNOWN"
            echo "------ | ---- | -------- | ---- | ------ | --- | -------"
            cat
          } | column -t -s '|'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
