name: Build and push Docker image

on:
  push:
    tags:
      - 'v*.*.*-r*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Parse versions (Bitnami-style vX.Y.Z-rN)
        id: parse
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          echo "Git tag: ${REF}"
          if ! [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            echo "::error::Tag '${REF}' does not match expected format vX.Y.Z-rN (e.g. v7.15.2-r0)"
            exit 1
          fi
          FULL="${REF#v}"
          SUITECRM="${FULL%%-*}"
          MAJOR_MINOR="$(echo "${SUITECRM}" | cut -d. -f1,2)"
          MAJOR="$(echo "${SUITECRM}" | cut -d. -f1)"
          echo "full_version=${FULL}" >> "${GITHUB_OUTPUT}"
          echo "suitecrm_version=${SUITECRM}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${MAJOR_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "Parsed FULL=${FULL} SUITECRM=${SUITECRM} MAJOR_MINOR=${MAJOR_MINOR} MAJOR=${MAJOR}"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.parse.outputs.full_version }}
            type=raw,value=${{ steps.parse.outputs.suitecrm_version }}
            type=raw,value=${{ steps.parse.outputs.major_minor }}
            type=raw,value=${{ steps.parse.outputs.major }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SUITECRM_VERSION=${{ steps.parse.outputs.suitecrm_version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Generate vulnerability summary
        if: always()
        shell: bash
        run: |
          REPORT=${{ github.workspace }}/trivy-report.json
          trivy image --format json \
              --cache-dir ${{ github.workspace }}/.cache/trivy \
              --skip-db-update \
              --skip-java-db-update \
              -o "$REPORT" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          echo ""
          echo "======= Trivy Vulnerability Summary ======="
          echo ""
          jq -r '
              .Results[]? | select(.Vulnerabilities != null) |
              "\(.Target) | \(.Type) | \([.Vulnerabilities[] | select(.Severity == "CRITICAL")] | length) | \([.Vulnerabilities[] | select(.Severity == "HIGH")] | length) | \([.Vulnerabilities[] | select(.Severity == "MEDIUM")] | length) | \([.Vulnerabilities[] | select(.Severity == "LOW")] | length) | \([.Vulnerabilities[] | select(.Severity == "UNKNOWN")] | length)"' "$REPORT" | \
            {
            echo "Target | Type | CRITICAL | HIGH | MEDIUM | LOW | UNKNOWN"
            echo "------ | ---- | -------- | ---- | ------ | --- | -------"
            cat
            } | column -t -s '|'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-results.sarif

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Changelog (commit + PR, EN)
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: .github/changelog-builder.json
          # HYBRID = PRs + direct commits (needed for push diretti su main senza PR)
          mode: HYBRID
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          generate_release_notes: false
