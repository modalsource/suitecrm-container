name: Weekly - Auto rebuild and publish

# Safety net for the weekly Trivy scan: if the *published* image still has
# fixable CRITICAL/HIGH vulnerabilities, bump the revision
# (vX.Y.Z-rN -> vX.Y.Z-r(N+1)), push the tag and trigger docker-publish.yml on
# it. A successful publish moves the floating tags, then the weekly scan is
# re-run so the tracking issue is refreshed/closed immediately.
#
# Why an explicit dispatch instead of relying on the tag push: events triggered
# by GITHUB_TOKEN (including a tag push) do not start new workflow runs.
# workflow_dispatch is the documented exception, hence we push the tag and then
# dispatch publish on it.

on:
  schedule:
    # Every Monday at 08:00 UTC (2h after the weekly scan at 06:00)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only detect and report the next revision, do not tag/publish'
        type: boolean
        required: false
        default: true

concurrency:
  group: auto-rebuild
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Floating major tag = latest published release; the rebuild republishes it.
  SCAN_TAG: '7'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create / push / delete the revision tag
      packages: read    # pull the published image
      actions: write    # dispatch docker-publish.yml and trivy-weekly.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the full tag history to compute the next revision

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SCAN_TAG }}
          format: json
          output: trivy-rebuild.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # This job decides what to do; it must not fail on findings.
          exit-code: 0

      - name: Decide next revision
        id: next
        shell: bash
        run: |
          set -euo pipefail

          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-rebuild.json)
          echo "Fixable CRITICAL/HIGH in :${SCAN_TAG}: $count"

          latest=$(git tag --list 'v*.*.*-r*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            echo "::error::No vX.Y.Z-rN tag found"
            exit 1
          fi
          base="${latest%-r*}"
          rev="${latest##*-r}"
          next="${base}-r$((rev + 1))"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Latest tag ${latest} -> next revision ${next}"

      - name: Bump revision and publish
        if: steps.next.outputs.count != '0' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "::error::Tag ${NEXT} already exists"
            exit 1
          fi

          git tag -a "$NEXT" -m "Automated rebuild: fixable CRITICAL/HIGH in :${SCAN_TAG}"
          git push origin "$NEXT"
          echo "Pushed $NEXT"

          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker-publish.yml \
            --limit 50 --json databaseId --jq '.[].databaseId' | sort)

          gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$NEXT"
          echo "Dispatched docker-publish.yml on $NEXT"

          # Resolve the run we just dispatched and wait for it. If the publish
          # fails (build error or the Trivy gate), drop the tag so dead
          # revisions don't accumulate; the weekly scan keeps the issue open.
          run_id=""
          for _ in $(seq 1 18); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker-publish.yml \
              --limit 50 --json databaseId --jq '.[].databaseId' | sort \
              | comm -13 <(echo "$before") - | head -n 1)
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Could not find the docker-publish run dispatched for $NEXT"
            exit 1
          fi

          if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
            echo "::error::docker-publish failed for $NEXT; deleting tag"
            git push origin ":refs/tags/$NEXT" || true
            exit 1
          fi
          echo "Published $NEXT"

      - name: Re-run the weekly scan
        if: steps.next.outputs.count != '0' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Floating tags now point at the rebuilt image: re-scan so the tracking
          # issue is refreshed/closed right away instead of next Monday.
          gh workflow run trivy-weekly.yml --repo "$GITHUB_REPOSITORY"
          echo "Dispatched trivy-weekly.yml"
